<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>YouTube</title>
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head>
<body><div id="player"></div><script>
window.youtubeStatus={state:-1,error:0,ready:false};
window.onYouTubeIframeAPIReady=function(){
 const q=new URLSearchParams(location.search);
 window.youtubePlayer=new YT.Player("player",{
  width:"100%",height:"100%",videoId:q.get("v"),
  playerVars:{autoplay:q.get("play")==="1"?1:0,start:Number(q.get("start"))||0,playsinline:1,origin:location.origin},
  events:{
   onReady:function(e){youtubeStatus.ready=true;if(q.get("play")==="1")e.target.playVideo()},
   onStateChange:function(e){youtubeStatus.state=e.data},
   onError:function(e){youtubeStatus.error=e.data},
   onAutoplayBlocked:function(){youtubeStatus.error=-1}
  }
 });
};
const script=document.createElement("script");script.src="https://www.youtube.com/iframe_api";script.onerror=function(){youtubeStatus.error=-2};document.head.append(script);
</script></body></html>
